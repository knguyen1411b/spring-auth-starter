spring:
  application:
    name: ${APPLICATION_NAME:spring-auth-starter}
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${MAIL_SMTP_AUTH:false}
        starttls.enable: ${MAIL_SMTP_STARTTLS:false}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    deserialization:
      fail-on-unknown-properties: true

application:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:noreply@example.test}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${SUPER_USER_USERNAME:}
    password: ${SUPER_USER_PASSWORD:}
    full-name: ${SUPER_USER_FULL_NAME:Administrator}
    email: ${SUPER_USER_EMAIL:}
  security:
    password-reset:
      expiration: ${PASSWORD_RESET_EXPIRATION:900000}
      resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:60000}
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:avatars}
  public-id-prefix: ${CLOUDINARY_PUBLIC_ID_PREFIX:user_}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    defaultModelsExpandDepth: 0
    tags-sorter: alpha
