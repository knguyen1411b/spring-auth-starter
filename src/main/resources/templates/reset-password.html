<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Đặt lại mật khẩu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f5f6fa; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 10px 25px #00000012; }
    h1 { margin: 0 0 12px; font-size: 26px; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    input[type=password], input[type=text] { width: 100%; min-height: 44px; margin-top: 6px; padding: 10px; border: 1px solid #667085; border-radius: 6px; font: inherit; }
    .toggle { display: flex; gap: 10px; align-items: center; min-height: 44px; font-weight: 400; }
    button { width: 100%; min-height: 44px; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px; background: #1748ba; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: default; }
    :focus-visible { outline: 3px solid #1748ba; outline-offset: 3px; }
    small { display: block; color: #475467; margin-top: 6px; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
<main>
  <h1>Đặt lại mật khẩu</h1>
  <p>Đặt mật khẩu mới. Sau khi hoàn tất, bạn cần đăng nhập lại trên các thiết bị.</p>
  <form id="reset-form">
    <label for="password">Mật khẩu mới</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="64" aria-describedby="password-help" required>
    <small id="password-help">Từ 12 đến 64 ký tự, tối đa 72 byte UTF-8.</small>
    <label for="confirmation">Nhập lại mật khẩu mới</label>
    <input id="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="64" required>
    <label class="toggle"><input id="show-password" type="checkbox"> Hiện mật khẩu</label>
    <button id="submit" type="submit">Đặt lại mật khẩu</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  let token;
  const form = document.getElementById('reset-form');
  const password = document.getElementById('password');
  const confirmation = document.getElementById('confirmation');
  const button = document.getElementById('submit');
  const status = document.getElementById('status');
  function readResetLink() {
    const incoming = new URLSearchParams(location.hash.slice(1)).get('token');
    if (incoming) {
      token = incoming;
      history.replaceState(null, '', location.pathname);
      form.reset();
      form.hidden = false;
      button.disabled = false;
      status.textContent = '';
    } else if (!token) {
      button.disabled = true;
      status.textContent = 'Link không hợp lệ. Vui lòng yêu cầu email đặt lại mật khẩu mới.';
    }
  }
  window.addEventListener('hashchange', readResetLink);
  readResetLink();
  document.getElementById('show-password').addEventListener('change', event => {
    password.type = confirmation.type = event.target.checked ? 'text' : 'password';
  });
  confirmation.addEventListener('input', () => confirmation.setCustomValidity(''));
  password.addEventListener('input', () => { password.setCustomValidity(''); confirmation.setCustomValidity(''); });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (new TextEncoder().encode(password.value).length > 72) {
      password.setCustomValidity('Mật khẩu vượt quá 72 byte UTF-8.');
      password.reportValidity();
      return;
    }
    if (password.value !== confirmation.value) {
      confirmation.setCustomValidity('Hai mật khẩu chưa trùng nhau.');
      confirmation.reportValidity();
      return;
    }
    button.disabled = true;
    status.textContent = 'Đang xử lý…';
    try {
      const response = await fetch('/api/v1/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password.value })
      });
      if (!response.ok) {
        status.textContent = response.status === 401
          ? 'Link đã hết hạn hoặc đã được sử dụng. Vui lòng yêu cầu email mới.'
          : 'Chưa thể đặt lại mật khẩu. Vui lòng kiểm tra mật khẩu và thử lại.';
        button.disabled = false;
        return;
      }
      form.hidden = true;
      form.reset();
      status.textContent = 'Đã đặt lại mật khẩu và đăng xuất tất cả thiết bị. Bạn có thể đăng nhập bằng mật khẩu mới.';
    } catch {
      status.textContent = 'Không kết nối được máy chủ. Vui lòng thử lại.';
      button.disabled = false;
    }
  });
</script>
</body>
</html>
